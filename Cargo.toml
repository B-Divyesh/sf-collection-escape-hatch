[package]
name = "collection-escape-hatch"
version = "0.1.2"
edition = "2024"
description = "Compare Postman migrations to Bruno or Hoppscotch without sending requests"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-collection-escape-hatch"
readme = "README.md"
keywords = ["postman", "bruno", "hoppscotch", "migration", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "escape-hatch"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
